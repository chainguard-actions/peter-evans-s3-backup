name: Test S3 Backup - Invalid Credentials (Expected Failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory with test file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/backup-src"
          echo "test content" > "$GITHUB_WORKSPACE/backup-src/test.txt"

      - name: Run S3 Backup action with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          STORAGE_SERVICE_ALIAS: s3test
          STORAGE_SERVICE_URL: https://s3.amazonaws.com
          ACCESS_KEY_ID: FAKEKEYID
          SECRET_ACCESS_KEY: FAKESECRETKEY
          MIRROR_SOURCE: /github/workspace/backup-src
          MIRROR_TARGET: fake-bucket-that-does-not-exist

      - name: Assert action failed with expected error (not a setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid,
          # not because of a missing env var or setup issue.
          # A 'failure' outcome means the action ran and exited non-zero,
          # which is the expected behavior with invalid credentials.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          else
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
