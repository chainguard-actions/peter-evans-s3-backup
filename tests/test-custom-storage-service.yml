name: Test S3 Backup with custom storage service
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run S3 Backup action with custom storage service URL (expect failure - unreachable endpoint)
        id: action
        uses: .
        continue-on-error: true
        env:
          ACCESS_KEY_ID: fake-access-key
          SECRET_ACCESS_KEY: fake-secret-key
          MIRROR_TARGET: fake-bucket/backup
          STORAGE_SERVICE_URL: http://localhost:9000
          STORAGE_SERVICE_ALIAS: minio

      - name: Assert action failed (custom endpoint is unreachable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable custom endpoint, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when custom storage endpoint is unreachable"
