name: Test S3 Backup - Local Endpoint (Expected Failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory with test files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/backup-src"
          echo "hello world" > "$GITHUB_WORKSPACE/backup-src/hello.txt"
          echo "another file" > "$GITHUB_WORKSPACE/backup-src/another.txt"

      - name: Run S3 Backup action with local endpoint (expect failure - no server running)
        id: action
        uses: .
        continue-on-error: true
        env:
          STORAGE_SERVICE_ALIAS: localtest
          STORAGE_SERVICE_URL: http://127.0.0.1:9000
          ACCESS_KEY_ID: minioadmin
          SECRET_ACCESS_KEY: minioadmin
          MIRROR_SOURCE: /github/workspace/backup-src
          MIRROR_TARGET: test-bucket/backup

      - name: Assert action failed due to connection error (not a config/setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because no S3 server is running at localhost:9000.
          # This verifies the action correctly:
          # 1. Reads all required env vars
          # 2. Configures mc with the provided host settings
          # 3. Attempts the mirror operation (and fails due to no server)
          # A 'failure' outcome confirms the action ran through its setup and
          # attempted the mirror, which is the expected behavior.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no S3 server at localhost:9000)"
          else
            echo "FAIL: expected action to fail with no S3 server, got outcome=$OUTCOME"
            exit 1
          fi
