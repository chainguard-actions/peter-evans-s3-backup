name: Test missing MIRROR_TARGET fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          ACCESS_KEY_ID: dummy-key
          SECRET_ACCESS_KEY: dummy-secret
          MIRROR_TARGET: ""
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when MIRROR_TARGET is empty"
            exit 1
          fi
          echo "PASS"
