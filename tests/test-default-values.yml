name: Test S3 Backup - Default Values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run S3 Backup action using default STORAGE_SERVICE_URL and STORAGE_SERVICE_ALIAS
        id: action
        uses: .
        continue-on-error: true
        env:
          # STORAGE_SERVICE_ALIAS defaults to "s3"
          # STORAGE_SERVICE_URL defaults to "https://s3.amazonaws.com"
          # MIRROR_SOURCE defaults to "."
          ACCESS_KEY_ID: FAKEKEYID
          SECRET_ACCESS_KEY: FAKESECRETKEY
          MIRROR_TARGET: fake-bucket/backup

      - name: Assert action failed as expected (invalid credentials with defaults)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With default values, the action should still attempt to connect to
          # https://s3.amazonaws.com and fail due to invalid credentials.
          # This verifies the default value logic in entrypoint.sh works correctly.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with default values and invalid credentials"
          else
            echo "FAIL: expected action to fail, got outcome=$OUTCOME"
            exit 1
          fi
