name: Test S3 Backup with missing required env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run S3 Backup action without required env vars (expect failure)
        id: action
        uses: .
        continue-on-error: true
        # Intentionally omitting ACCESS_KEY_ID, SECRET_ACCESS_KEY, MIRROR_TARGET

      - name: Assert action failed due to missing required env vars
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required env vars are missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required env vars are missing"
